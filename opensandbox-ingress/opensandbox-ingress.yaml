# opensandbox-ingress.yaml  (in opensandbox)
#
# Single Ingress, two hosts:
#   sandbox.systrox.com    -> opensandbox-server          (in tls: -> HTTPS + redirect, Cloudflare-facing)
#   *.sandbox.systrox.com  -> opensandbox-ingress-gateway (NOT in tls: -> plain HTTP, TEMP for testing)
#
# nginx-ingress applies the HTTPS redirect per-host, only to hosts that have a TLS
# cert. Leaving the wildcard out of tls: serves it over HTTP without touching the
# apex. Wildcard TLS needs DNS-01 (Let's Encrypt won't issue *.<domain> over HTTP-01);
# add it back here via a DNS-01 (Cloudflare) issuer once gateway routing is confirmed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensandbox-ingress
  namespace: opensandbox-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sandbox.systrox.com
    secretName: opensandbox-tls
  rules:
  - host: sandbox.systrox.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opensandbox-server
            port:
              number: 80

  # Sandbox pod traffic (wildcard) — HTTP-only for now (not in tls: above)
  - host: "*.sandbox.systrox.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opensandbox-ingress-gateway
            port:
              number: 80
