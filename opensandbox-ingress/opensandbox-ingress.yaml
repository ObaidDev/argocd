# opensandbox-ingress.yaml  (in opensandbox)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensandbox-ingress
  namespace: opensandbox-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sandbox.systrox.com
    - "*.sandbox.systrox.com" 
    secretName: opensandbox-tls
  rules:
  - host: sandbox.systrox.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opensandbox-server
            port:
              number: 80

  # Sandbox pod traffic (wildcard)  
  - host: "*.sandbox.systrox.com"  
    http:  
      paths:  
      - path: /  
        pathType: Prefix  
        backend:  
          service:  
            name: opensandbox-ingress-gateway  
            port:  
              number: 80