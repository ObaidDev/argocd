# opensandbox-ingress.yaml  (in opensandbox)
#
# Single Ingress, two hosts, both HTTPS (browser-trusted via Let's Encrypt prod):
#   sandbox.systrox.com    -> opensandbox-server          (apex, Cloudflare-fronted)
#   *.sandbox.systrox.com  -> opensandbox-ingress-gateway (per-sandbox subdomains, DNS-only/direct)
#
# Both SANs live in one cert (opensandbox-tls). A wildcard does NOT cover its own
# base, so the apex is listed explicitly alongside *.sandbox.systrox.com. The cert
# is issued by letsencrypt-prod via the Cloudflare DNS-01 solver (see
# infrastructure/cluster-issuer.yaml) — HTTP-01 can't issue wildcards. ssl-redirect
# is back on (default): both hosts now have a trusted cert, so HTTP -> HTTPS is safe.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensandbox-ingress
  namespace: opensandbox-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sandbox.systrox.com
    - "*.sandbox.systrox.com"
    secretName: opensandbox-tls
  rules:
  - host: sandbox.systrox.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opensandbox-server
            port:
              number: 80

  # Sandbox pod traffic (wildcard) — HTTPS via the shared opensandbox-tls cert above
  - host: "*.sandbox.systrox.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opensandbox-ingress-gateway
            port:
              number: 80
